<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5"
    />
    <title>Wisdom — See truly. Judge wisely. Speak meaningfully. Live faithfully.</title>
    <meta
      name="description"
      content="A Christian practical-wisdom formation app. Train to see beneath the surface, interpret responsibly, judge well, understand people, and give counsel that helps."
    />

    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <meta name="theme-color" content="#14100c" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6efe1" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="light dark" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Wisdom" />
    <meta name="format-detection" content="telephone=no" />

    <meta property="og:title" content="Wisdom" />
    <meta
      property="og:description"
      content="A school of practical wisdom: see truly, judge wisely, speak meaningfully, live faithfully."
    />
    <meta property="og:type" content="website" />

    <style>
      /* Painted before the bundle parses so the first frame is never a white
         flash on a dark-mode phone. */
      html {
        background: #14100c;
      }
      @media (prefers-color-scheme: light) {
        html {
          background: #f6efe1;
        }
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        font:
          500 0.95rem/1.4 ui-serif,
          Georgia,
          serif;
        color: #c8a24a;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot">Wisdom</div></div>
    <noscript>
      <p style="padding: 2rem; font-family: ui-serif, Georgia, serif">
        Wisdom needs JavaScript enabled to run. All of your work stays on this device.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
