<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5"
    />
    <title>Still Before Him — Morning &amp; Evening Prayer</title>
    <meta
      name="description"
      content="A Christian morning and evening prayer companion: behold God's glory, pray honestly, read Scripture slowly, sit in silence, and stretch gently."
    />

    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <meta name="theme-color" content="#10141f" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6efdf" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="light dark" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Still" />
    <meta name="format-detection" content="telephone=no" />

    <meta property="og:title" content="Still Before Him" />
    <meta
      property="og:description"
      content="A morning and evening rhythm of prayer, Scripture, and silence."
    />
    <meta property="og:type" content="website" />

    <style>
      /* Painted before the bundle parses so the first frame is never a white
         flash on a dark-mode phone. */
      html {
        background: #10141f;
      }
      @media (prefers-color-scheme: light) {
        html {
          background: #f6efdf;
        }
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        font:
          500 0.9rem/1.4 ui-serif,
          Georgia,
          serif;
        color: #b98a2e;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot">Still</div></div>
    <noscript>
      <p style="padding: 2rem; font-family: ui-serif, Georgia, serif">
        Still Before Him needs JavaScript enabled to run. Everything you do in it stays on this
        device.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
